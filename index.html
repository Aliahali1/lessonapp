<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مغامرات المحققات الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p900:#3b1a63; --p700:#6a35a8; --p600:#7b3fbf; --p400:#a77ad8; --p200:#dccaf3; --p100:#efe5fa; --p50:#f8f3fd;
  --gold:#d9a441; --gold-soft:#fbf0d6;
  --ink:#2a1a3f; --muted:#6c5d82; --card:#ffffff; --bg:#faf7fe;
  --good:#1f8a5b; --good-bg:#e4f6ec; --bad:#c0392b; --bad-bg:#fdeaea; --warn-bg:#fff5dc;
  --radius:20px; --shadow:0 6px 24px rgba(106,53,168,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:17px;
  background-image:radial-gradient(circle at 12% 8%,rgba(167,122,216,.18),transparent 38%),radial-gradient(circle at 90% 92%,rgba(217,164,65,.14),transparent 34%);background-attachment:fixed}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}
.topbar{background:linear-gradient(120deg,var(--p900),var(--p600));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(59,26,99,.25)}
.brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.brand .dot{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:1.1rem}
.stepper{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:4px 12px;font-size:.85rem;white-space:nowrap;transition:.2s}
.step[disabled]{opacity:.45;cursor:not-allowed}
.step.on{background:var(--gold);color:var(--p900);font-weight:700}
.step.done:not(.on){background:rgba(255,255,255,.3)}
.progress{height:5px;background:rgba(255,255,255,.2);width:100%;border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.layout{max-width:1200px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.layout.no-luma{grid-template-columns:1fr}
.luma-col{position:sticky;top:96px}
.luma-card{background:var(--card);border:2px solid var(--p200);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center;animation:pop .45s ease}
.luma-card .bubble{position:relative;background:var(--p100);border:2px solid var(--p200);border-radius:18px;padding:12px 14px;text-align:right;font-weight:500;color:var(--p900);margin-bottom:14px;min-height:64px}
.luma-card .bubble::after{content:"";position:absolute;bottom:-11px;right:46%;width:18px;height:18px;background:var(--p100);border-inline-end:2px solid var(--p200);border-bottom:2px solid var(--p200);transform:rotate(45deg)}
.luma-card .bubble.swap{animation:swap .45s ease}
.luma-img-wrap{height:300px;display:flex;align-items:flex-end;justify-content:center}
.luma-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;animation:float 4s ease-in-out infinite}
.luma-fallback{width:140px;height:140px;border-radius:50%;background:var(--p100);display:grid;place-items:center;font-size:4rem}
.luma-name{font-weight:800;color:var(--p700);margin-top:6px}
.luma-hide{margin-top:8px;background:none;border:1px solid var(--p200);color:var(--muted);border-radius:999px;padding:3px 14px;font-size:.85rem}
.luma-show{position:fixed;inset-inline-start:16px;bottom:16px;z-index:30;border:0;background:var(--p600);color:#fff;border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);font-weight:700;display:none}
.layout.no-luma ~ .luma-show,.luma-show.visible{display:block}
.stage{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;min-height:420px;animation:rise .5s ease;border:1px solid var(--p100)}
.stage h1,.stage h2{color:var(--p700);margin:.2em 0 .4em;line-height:1.4}
.stage h2{font-size:1.6rem}
.chip{display:inline-block;background:var(--gold-soft);color:#8a5d0a;border-radius:999px;padding:2px 14px;font-weight:700;font-size:.85rem}
.lead{color:var(--muted);font-size:1.05rem}
.btn{border:0;border-radius:14px;padding:11px 24px;font-weight:700;background:var(--p600);color:#fff;transition:.2s;box-shadow:0 3px 0 var(--p700)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--p900);box-shadow:0 3px 0 #b3822a}
.btn.ghost{background:var(--p50);color:var(--p700);box-shadow:none;border:2px solid var(--p200)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:26px;align-items:center;flex-wrap:wrap}
.gate{color:var(--muted);font-size:.9rem}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.hero-img{height:520px;display:flex;align-items:flex-end;justify-content:center}
.hero-img img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(106,53,168,.3));animation:float 5s ease-in-out infinite}
.hero h1{font-size:2.3rem}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field input,.field textarea,.field select{border:2px solid var(--p200);border-radius:12px;padding:10px 14px;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid rgba(123,63,191,.25);border-color:var(--p600)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:2px solid var(--p100);border-radius:16px;padding:16px;background:var(--p50)}
.phone{max-width:340px;margin:12px auto;background:#1f1f2b;border-radius:30px;padding:14px;box-shadow:var(--shadow)}
.phone .msg{background:#fff;border-radius:18px;padding:14px;color:#222;font-size:.98rem}
.phone .msg b{color:#d6246e}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:right;border:2px solid var(--p200);background:#fff;border-radius:14px;padding:12px 16px;color:var(--ink);transition:.15s;font-weight:500}
.opt:hover{border-color:var(--p600);background:var(--p50)}
.opt.sel{border-color:var(--p600);background:var(--p100);font-weight:700}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:14px;padding:10px 14px;margin-top:8px;font-weight:500}
.fb.ok{background:var(--good-bg);color:#14633f}
.fb.no{background:var(--warn-bg);color:#7a5200}
.browser{border:2px solid var(--p200);border-radius:14px;overflow:hidden;background:#fff;margin:10px 0}
.browser .bar{display:flex;align-items:center;gap:10px;background:#eee7f7;padding:8px 12px;direction:ltr}
.browser .bar .lock{background:#fff;border-radius:999px;padding:4px 14px;flex:1;text-align:left;font-family:Consolas,monospace;font-size:.9rem;color:#222;overflow:auto;white-space:nowrap}
.browser .bar .lock span{color:var(--good)}
.browser .body{padding:10px 14px;color:var(--muted);font-size:.9rem}
.fake{border:3px dashed var(--p200);border-radius:16px;overflow:hidden;background:#fff}
.fake .bar{direction:ltr;background:#eee7f7;padding:8px 12px;font-family:Consolas,monospace;font-size:.85rem;display:flex;gap:8px;align-items:center}
.fake .page{padding:14px;display:grid;gap:10px}
.hot{border:2px dashed transparent;background:#fff;border-radius:12px;padding:10px 12px;text-align:right;width:100%;transition:.15s;color:var(--ink)}
.hot:hover{border-color:var(--p400);background:var(--p50)}
.hot.found{border:2px solid var(--bad);background:var(--bad-bg)}
.hot.plain-hit{border:2px solid var(--p200);background:var(--p50)}
.big-badge{font-size:2rem;font-weight:800;color:#d6246e}
.counter{font-weight:800;color:var(--p700)}
.pbar{height:12px;background:var(--p100);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p400),var(--gold));width:0;transition:width .4s}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:2px solid var(--p200);background:#fff;border-radius:999px;padding:6px 18px;font-weight:700;color:var(--p700)}
.tab.on{background:var(--p600);color:#fff;border-color:var(--p600)}
.substeps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.substeps span{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--p100);color:var(--muted)}
.substeps span.on{background:var(--p600);color:#fff}
.substeps span.dn{background:var(--good-bg);color:var(--good)}
.obs{display:grid;gap:10px}
.obs button{text-align:right}
.obs .res{margin-top:6px;font-weight:500}
.tag{display:inline-block;border-radius:999px;padding:0 10px;font-size:.78rem;font-weight:700;margin-inline-start:6px}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.crit{display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:center;border-bottom:1px dashed var(--p200);padding:10px 0}
.role{cursor:pointer;text-align:center;border:2px solid var(--p200);border-radius:16px;padding:14px;background:#fff;transition:.15s}
.role.sel{border-color:var(--p600);background:var(--p100)}
.role .ico{font-size:2rem}
.cert{border:6px double var(--gold);border-radius:20px;padding:26px;text-align:center;background:linear-gradient(180deg,#fff,var(--gold-soft));margin-top:16px}
.cert h3{color:var(--p700);font-size:1.6rem;margin:.2em}
.stat{background:var(--p50);border:2px solid var(--p100);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--p700)}
.footer{text-align:center;color:var(--muted);padding:20px;font-size:.9rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes swap{0%{transform:scale(.96);opacity:.3}100%{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .luma-col{position:static}
  .luma-card{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;text-align:right;padding:10px}
  .luma-card .bubble{margin:0;order:2}
  .luma-card .bubble::after{display:none}
  .luma-img-wrap{height:150px;order:1}
  .luma-name{display:none}
  .luma-hide{order:3;grid-column:1/-1;justify-self:center}

  .hero{grid-template-columns:1fr}
  .hero-img{height:360px;order:-1}
  .grid2,.grid3{grid-template-columns:1fr}
  .crit{grid-template-columns:1fr}
  .stage{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.luma-col,.navrow,.luma-show,.no-print{display:none!important}.layout{display:block}.stage{box-shadow:none;border:0}}
</style>
</head>

/* ========== المحطات: تحقق الإكمال ========== */
function done(i){
  switch(i){
    case 0: return true;
    case 1: return S.guess !== null;
    case 2: return !!(S.mcq.https && S.mcq.https.solved);
    case 3: return S.clues.size >= 5;
    case 4: return !!(S.role && S.ready);
    case 5: return S.sim.A.done && S.sim.B.done;
    case 6: return QUIZ.every(q => S.mcq[q.id] && S.mcq[q.id].solved);
    case 7: return true;
    default: return true;
  }
}
const GATE = {
  1:'اختاري رأيك المبدئي لتكملي.',
  2:'أجيبي عن السؤال لتنتقلي.',
  3:'اكتشفي 5 أدلة على الأقل لتكملي.',
  4:'اختاري دورك ثم أكدي جاهزية الفريق.',
  5:'أنهي تقييم المتجرين لتكملي.',
  6:'أجيبي عن جميع الأسئلة لتكملي.'
};

/* ========== مكوّنات مشتركة ========== */
function mcqHtml(q){
  const st = S.mcq[q.id] || {};
  const opts = q.o.map((t,idx)=>{
    let cls='opt';
    if(st.solved && idx===q.a) cls+=' ok';
    else if(st.sel===idx && st.checked && !st.solved) cls+=' no';
    else if(st.sel===idx) cls+=' sel';
    return `<button class="${cls}" data-act="pick" data-q="${q.id}" data-i="${idx}" ${st.solved?'disabled':''}>${esc(t)}</button>`;
  }).join('');
  let fb='';
  if(st.solved) fb = `<div class="fb ok">✔ إجابة صحيحة. ${esc(q.e)}</div>`;
  else if(st.hint) fb = `<div class="fb no">💡 ${esc(st.hint)}</div>`;
  const btn = st.solved ? '' : `<button class="btn" data-act="check" data-q="${q.id}" ${st.sel===undefined?'disabled':''}>تحققي</button>`;
  return `<div class="mcq"><p><b>${esc(q.q)}</b></p><div class="opts">${opts}</div>${btn}${fb}</div>`;
}
function checkMcq(q){
  const st = S.mcq[q.id] || (S.mcq[q.id]={});
  st.tries = (st.tries||0)+1; st.checked=true;
  if(st.sel===q.a){
    st.solved=true; st.hint='';
    if(st.tries===1 && q.id.startsWith('q')) S.quizFirst++;
    luma('encourage', pick(['أحسنتِ! إجابة صحيحة، استمري.','رائع! هكذا تفكر المحققة.','ممتاز، دليلك سليم!']));
    burst(12);
  }else{
    if(st.tries>=3){ st.solved=true; st.hint=''; st.revealed=true; luma('encourage','لا بأس، المحققات يتعلمن من المحاولة. راجعي الشرح وتابعي.'); }
    else{
      st.hint = q.h[Math.min(st.tries-1,q.h.length-1)];
      luma('encourage', st.tries===1 ? 'قريبة! جربي مرة أخرى بعد هذا التلميح.' : 'لا تيأسي، لديكِ توجيه إضافي الآن.');
    }
  }
}
const pick = a => a[Math.floor(Math.random()*a.length)];
function burst(n){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c=document.createElement('div'); c.className='confetti';
  const cols=['#7b3fbf','#d9a441','#a77ad8','#f5d98a','#dccaf3'];
  for(let k=0;k<n;k++){const i=document.createElement('i');i.style.left=Math.random()*100+'%';i.style.background=cols[k%cols.length];i.style.animationDuration=(2+Math.random()*2)+'s';i.style.animationDelay=(Math.random()*.4)+'s';c.appendChild(i)}
  document.body.appendChild(c); setTimeout(()=>c.remove(),4500);
}

/* ========== عرض المحطات ========== */
function renderStage(){
  const i=S.i, el=$('#stage');
  let h='';
  if(i===0) h=vHome();
  else if(i===1) h=vIntro();
  else if(i===2) h=vSecure();
  else if(i===3) h=vFraud();
  else if(i===4) h=vTeam();
  else if(i===5) h=vSim();
  else if(i===6) h=vQuiz();
  else if(i===7) h=vAchieve();
  else h=vBye();
  if(i>0 && i<8) h += navRow();
  el.innerHTML = h;
  renderStepper();
}
function navRow(){
  const ok = done(S.i);
  return `<div class="navrow no-print">
    <button class="btn ghost" data-act="prev">→ السابق</button>
    <span class="gate">${ok?'':(GATE[S.i]||'')}</span>
    <button class="btn gold" data-act="next" ${ok?'':'disabled'}>${S.i===7?'إلى الختام ←':'التالي ←'}</button>
  </div>`;
}
function renderStepper(){
  $('#stepper').innerHTML = STATIONS.map((s,idx)=>{
    const locked = idx>S.max;
    return `<button class="step ${idx===S.i?'on':''} ${idx<S.max&&done(idx)?'done':''}" data-act="goto" data-i="${idx}" ${locked?'disabled':''}>${idx>0&&idx<8?idx+'. ':''}${s.n}</button>`;
  }).join('');
  $('#prog').style.width = (S.i/(STATIONS.length-1)*100)+'%';
}
function go(i){
  S.i=i; S.max=Math.max(S.max,i);
  const e=ENTER[i]; luma(e.img, e.t);
  renderStage(); window.scrollTo({top:0,behavior:'smooth'});
  if(i===5) simLuma();
  if(i===7){burst(40); sendResults();}
}

  return `<span class="chip">المحطة 5</span><h2>محاكاة المتجر الإلكتروني</h2>
  <div class="tabs">${tabs}</div>
  <div class="card" style="margin-bottom:12px"><b>${store.name}</b> · ${store.tag}<br><span style="direction:ltr;display:inline-block;color:var(--muted)">${store.domain}</span> · ${store.offer}</div>
  <div class="substeps">${subs}</div>${body}`;
}
function simObs(store,st,key){
  const items=store.steps[key];
  const all=items.every(it=>st.seen[it.k]);
  const btns=items.map(it=>`<div><button class="opt" data-act="inspect" data-k="${it.k}" ${st.seen[it.k]?'disabled':''}>🔎 افحصي: ${it.label}</button>
    ${st.seen[it.k]?`<div class="res fb ${it.pol==='good'?'ok':'no'}">${it.text} <span class="tag ${it.pol}">${it.pol==='good'?'مؤشر مطمئن':'مؤشر مقلق'}</span></div>`:''}</div>`).join('');
  return `<p class="lead">افحصي كل عنصر لتعرفي ما يخفيه.</p><div class="obs">${btns}</div>
    <div class="navrow"><span></span><button class="btn" data-act="simnext" ${all?'':'disabled'}>الخطوة التالية ←</button></div>`;
}
function evidenceOf(store,st){
  const out=[]; ['front','seller','pay'].forEach(g=>store.steps[g].forEach(it=>{if(st.seen[it.k])out.push(it)})); return out;
}
function simNotes(store,st){
  const ev=evidenceOf(store,st);
  const list=ev.map(it=>`<li>${it.label}: ${it.text} <span class="tag ${it.pol}">${it.pol==='good'?'+':'−'}</span></li>`).join('');
  return `<p class="lead">هذه الأدلة التي جمعتِها:</p><ul>${list}</ul>
  <div class="field"><label>ملاحظاتك: ما أبرز ما لفت انتباهك؟ (جملة واحدة على الأقل)</label><textarea rows="3" data-bind="note" placeholder="اكتبي ملاحظتك هنا">${esc(st.note)}</textarea></div>
  <div class="navrow"><span></span><button class="btn" data-act="simnext" ${st.note.trim().length>=8?'':'disabled'}>الخطوة التالية ←</button></div>`;
}
function simRate(store,st){
  const rows=CRITERIA.map(c=>`<div class="crit"><div><b>${c.label}</b><div style="font-size:.85rem;color:var(--muted)">استندي إلى أدلة: ${c.from}</div></div>
    <select data-bind="rate" data-c="${c.k}"><option value="">اختاري الدرجة</option><option value="1" ${st.rating[c.k]==='1'?'selected':''}>1 · ضعيف</option><option value="2" ${st.rating[c.k]==='2'?'selected':''}>2 · متوسط</option><option value="3" ${st.rating[c.k]==='3'?'selected':''}>3 · قوي</option></select></div>`).join('');
  const complete=CRITERIA.every(c=>st.rating[c.k]);
  return `<p class="lead">قيّمي المتجر في كل معيار بحسب ما سجلتِه من أدلة.</p>${rows}
  ${st.msg?`<div class="fb ${st.msgType}">${st.msg}</div>`:''}
  <div class="navrow"><span></span><button class="btn" data-act="checkrate" ${complete?'':'disabled'}>تحققي من تقييمي</button></div>`;
}
function simRec(store,st){
  const ev=evidenceOf(store,st);
  const opts=ev.map(it=>`<option value="${esc(it.label+': '+it.text)}" ${st.strong===it.label+': '+it.text?'selected':''}>${it.label} — ${it.text}</option>`).join('');
  const r=(v,t)=>`<button class="opt ${st.rec===v?'sel':''}" data-act="rec" data-v="${v}">${t}</button>`;
  const ok=st.rec&&st.strong&&st.why.trim().length>=10;
  return `<p class="lead">حان وقت القرار.</p>
  <div class="opts">${r('buy','أنصح بالشراء من هذا المتجر بحذر')}${r('avoid','لا أنصح بالشراء من هذا المتجر')}</div>
  <div class="field"><label>الدليل الأقوى الذي استندتِ إليه</label><select data-bind="strong"><option value="">اختاري دليلًا</option>${opts}</select></div>
  <div class="field"><label>اشرحي قرارك في جملة أو جملتين</label><textarea rows="3" data-bind="why" placeholder="لأنني وجدت أن...">${esc(st.why)}</textarea></div>
  ${st.msg?`<div class="fb ${st.msgType}">${st.msg}</div>`:''}
  <div class="navrow"><span></span><button class="btn gold" data-act="submitrec" ${ok?'':'disabled'}>أصدري التوصية ✅</button></div>`;
}
function simLuma(){
  const st=S.sim[S.tab];
  if(st.done){ luma('achieve','أحسنتِ! أنهيتِ تقييم هذا المتجر وجمعتِ الأدلة وأصدرتِ التوصية.'); return; }
  const s=SIM_STEPS[st.step]; luma(s.img, s.say);
}

/* 6 التقويم */
function vQuiz(){
  const solved=QUIZ.filter(q=>S.mcq[q.id]&&S.mcq[q.id].solved).length;
  return `<span class="chip">المحطة 6</span><h2>التقويم الختامي</h2>
  <div class="counter">أجبتِ ${solved} من ${QUIZ.length}</div><div class="pbar"><i style="width:${solved/QUIZ.length*100}%"></i></div>
  ${QUIZ.map(q=>`<div class="card" style="margin-bottom:14px">${mcqHtml(q)}</div>`).join('')}`;
}

/* 7 الإنجاز */
function stats(){
  const recOK=['A','B'].filter(k=>S.sim[k].ok).length;
  return {clues:S.clues.size, quiz:S.quizFirst, stores:recOK};
}
function vAchieve(){
  const s=stats();
  const guessTxt={safe:'يبدو آمنًا',unsafe:'يبدو مريبًا',unknown:'لا أعرف بعد'}[S.guess]||'—';
  return `<span class="chip">المحطة 7</span><h2>🏅 الإنجاز</h2>
  <div class="grid3">
    <div class="stat"><b>${s.clues} / 7</b>أدلة مكتشفة</div>
    <div class="stat"><b>${s.quiz} / ${QUIZ.length}</b>إجابات صحيحة من المحاولة الأولى</div>
    <div class="stat"><b>${s.stores} / 2</b>توصيات صحيحة من المحاولة الأولى</div>
  </div>
  <div class="card" style="margin-top:14px">رأيك الأول كان: <b>${guessTxt}</b>. ثم جمعتِ الأدلة وقارنتِ بين المتجرين، وهذا ما يجعل قرارك واعيًا.</div>
  <div class="cert"><div style="font-size:2.4rem">🏅</div><div>شهادة إنجاز</div><h3>${esc(nm())}</h3>
    <p>أتمّت مهمة «مغامرات المحققات الرقمية» وتمكنت من تقييم المتاجر الإلكترونية بالأدلة.</p>
    <p style="color:var(--muted)">محققة رقمية معتمدة · مع لمى</p></div>
  <div class="card eval no-print" style="margin-top:14px;text-align:center"><b>رأيك يهمنا!</b><br>شاركي تقييمك للدرس التطبيقي «التعاملات الآمنة عبر الإنترنت».<br><a class="btn gold" href="${EVAL_URL}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;margin-top:8px">📝 افتحي استمارة تقييم الدرس</a></div>
  <div class="navrow no-print"><button class="btn ghost" data-act="print">🖨️ طباعة الشهادة</button></div>`;
}

/* 8 الختام */
function vBye(){
  return `<div class="hero">
    <div><span class="chip">نهاية الرحلة</span><h1>شكرًا لكِ يا ${esc(nm())}</h1>
    <div class="card" style="font-size:1.2rem;font-weight:700;color:var(--p700);background:var(--gold-soft);border-color:var(--gold)">تحققي قبل أن تثقي،<br>وفكري قبل أن تشتري.</div>
    <p class="lead">شاركي زميلاتك ما اكتشفتِه، وطبّقي خطوات المحققة في أي متجر تقابلينه.</p>
    <div class="card eval" style="margin:14px 0"><b>قبل أن تغادري:</b> قيّمي الدرس التطبيقي «التعاملات الآمنة عبر الإنترنت».<br><a class="btn gold" href="${EVAL_URL}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;margin-top:8px">📝 استمارة تقييم الدرس التطبيقي</a></div>
    <button class="btn ghost" data-act="restart">إعادة المغامرة 🔄</button></div>
    <div class="hero-img">${lumaImg('goodbye')}</div></div>`;
}

/* ========== إرسال النتائج (اختياري) ========== */
function sendResults(){
  if(!SHEET_ENDPOINT || S.sent) return; S.sent=true;
  const s=stats();
  try{
    fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({name:S.name,guess:S.guess,clues:s.clues,quiz:s.quiz,stores:s.stores,role:S.role,time:new Date().toISOString()})});
  }catch(e){}
}

/* ========== التفاعل ========== */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='hideLuma') return setLumaHidden(true);
  if(a==='showLuma') return setLumaHidden(false);
  if(a==='goto'){ if(+t.dataset.i<=S.max) go(+t.dataset.i); return; }
  if(a==='start'){ go(1); return; }
  if(a==='next'){ if(done(S.i)) go(S.i+1); return; }
  if(a==='prev'){ go(Math.max(0,S.i-1)); return; }
  if(a==='restart'){ location.reload(); return; }
  if(a==='print'){ window.print(); return; }
  if(a==='guess'){ S.guess=t.dataset.k;
    luma('thinking', S.guess==='unsafe'?'حدسك مهم! لكن المحققة تثبت حدسها بالأدلة.':S.guess==='safe'?'فكرة مفهومة. هل العرض المغري يكفي؟ لنختبر ذلك بالأدلة.':'جواب حكيم! المحققة تبدأ بالسؤال لا بالحكم.');
    return renderStage(); }
  if(a==='pick'){ const st=S.mcq[t.dataset.q]||(S.mcq[t.dataset.q]={}); st.sel=+t.dataset.i; st.checked=false; return renderStage(); }
  if(a==='check'){ const q=[HTTPS_Q,...QUIZ].find(x=>x.id===t.dataset.q); checkMcq(q); return renderStage(); }
  if(a==='clue'){
    const c=CLUES.find(x=>x.id===t.dataset.id);
    if(c.real){ if(!S.clues.has(c.id)){ S.clues.add(c.id); burst(5);} luma('clue', c.text); }
    else{ S.plainHits.add(c.id); luma('encourage', c.text); }
    return renderStage(); }
  if(a==='role'){ S.role=t.dataset.k; return renderStage(); }
  if(a==='ready'){ S.ready=t.checked; if(S.ready&&S.role) luma('encourage','فريق رائع! لنبدأ التحقيق.'); return renderStage(); }
  if(a==='tab'){ S.tab=t.dataset.k; renderStage(); simLuma(); return; }
  const st=S.sim[S.tab], store=STORES[S.tab];
  if(a==='inspect'){ st.seen[t.dataset.k]=true;
    const it=Object.values(store.steps).flat().find(x=>x.k===t.dataset.k);
    luma('clue', it.pol==='good'?'مؤشر مطمئن! سجّليه في أدلتك.':'انتبهي! هذا مؤشر يدعو للقلق.'); return renderStage(); }
  if(a==='simnext'){ st.step++; st.msg=''; renderStage(); simLuma(); return; }
  if(a==='checkrate'){
    const exp=store.ok?3:1; const bad=CRITERIA.filter(c=>Math.abs(+st.rating[c.k]-exp)>1);
    st.rtries++;
    if(!bad.length || st.rtries>=3){
      st.msg=''; st.step++; renderStage(); simLuma(); luma('encourage', bad.length?'لا بأس، لنكمل. راجعي الأدلة لاحقًا لتتأكدي.':'تقييم متقن يستند إلى الأدلة!'); return;
    }
    st.msg='💡 راجعي أدلة «'+bad[0].from+'» ثم أعيدي النظر في معيار «'+bad[0].label+'».'; st.msgType='no';
    luma('encourage', st.rtries===1?'قريبة! عودي إلى الأدلة وانظري ما تقوله فعلًا.':'لا تتعجلي، قارني عدد المؤشرات المطمئنة بالمقلقة.');
    return renderStage(); }
  if(a==='rec'){ st.rec=t.dataset.v; return renderStage(); }
  if(a==='submitrec'){
    const ok=(st.rec==='buy')===store.ok; st.ctries++;
    if(ok || st.ctries>=3){
      st.done=true; st.ok=ok && st.ctries===1; st.msg='';
      renderStage(); luma('achieve','أحسنتِ أيتها المحققة! جمعتِ الأدلة وأصدرتِ قرارًا واعيًا.'); burst(30); return;
    }
    const ev=evidenceOf(store,st); const good=ev.filter(x=>x.pol==='good').length, bad=ev.length-good;
    st.msg = st.ctries===1 ? '💡 هل يتفق قرارك مع تقييمك للمعايير؟ ارجعي إلى الأدلة.' : `💡 عدد المؤشرات المطمئنة ${good} مقابل ${bad} مؤشرات مقلقة. ماذا يقول ذلك؟`;
    st.msgType='no'; luma('encourage','فكري مجددًا؛ الأدلة تتحدث بوضوح.'); return renderStage();
  }
});
document.addEventListener('input', e=>{
  const t=e.target; if(!t.dataset.bind) return;
  const b=t.dataset.bind, st=S.sim[S.tab];
  if(b==='name'){ S.name=t.value; return; }
  if(b==='note'||b==='why'){ st[b]=t.value;
    const btn=document.querySelector('[data-act="simnext"],[data-act="submitrec"]');
    if(btn){ if(b==='note') btn.disabled = st.note.trim().length<8; else btn.disabled = !(st.rec&&st.strong&&st.why.trim().length>=10); }
    return; }
  if(b==='rate'){ st.rating[t.dataset.c]=t.value; renderStage(); return; }
  if(b==='strong'){ st.strong=t.value; renderStage(); return; }
});
document.addEventListener('change', e=>{ if(e.target.dataset.act==='ready') document.dispatchEvent(new CustomEvent('x')); });
document.addEventListener('change', e=>{ const t=e.target; if(t.dataset.act==='ready'){ S.ready=t.checked; renderStage(); } });

/* ========== بدء التشغيل ========== */
go(0);
</script>
</body>
</html>
